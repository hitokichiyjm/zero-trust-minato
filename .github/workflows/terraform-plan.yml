# プルリクエストで terraform plan と静的チェックを実行する(NFR-MNT-02)
# - apply はしない。AWS のロールは読み取り専用(DOC-03 12.2)
# - アクションはコミットハッシュで固定する(NFR-SEC-06)
# - 公開リポジトリのログにアカウントIDやメールアドレスを出さない
name: terraform-plan

# paths で絞らず、すべてのプルリクエストで動かす。
# main の保護で「plan と Checkov の成功」を必須にしているため、
# 文書だけの PR でジョブが動かないと、いつまでもマージできなくなる。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov(設定の静的チェック)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: terraform
          framework: terraform
          quiet: true

  plan:
    name: plan (${{ matrix.dir }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC のトークンを受け取るため
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/bootstrap
          - terraform/org
          - terraform/identity
          - terraform/baseline
          - terraform/logging
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
      TF_VAR_management_account_id: ${{ secrets.MANAGEMENT_ACCOUNT_ID }}
      TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
      TF_VAR_account_emails: ${{ secrets.ACCOUNT_EMAILS }}
      TF_VAR_admin_user_name: ${{ secrets.ADMIN_USER_NAME }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      # メンバーアカウントでは、読み取り専用のロールを引き受ける(baseline スタックで作ったもの)
      TF_VAR_member_role_name: zero-trust-minato-plan-readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: backend.tf があるか確認
        id: backend
        run: |
          if [ -f backend.tf ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::backend.tf がないため plan を飛ばします(状態ファイルの移行前)"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.backend.outputs.exists == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      # 組織の全アカウントのIDをログで隠す(plan の「Refreshing state... [id=...]」に出るため)
      # configure-aws-credentials が隠すのは、ロールのあるアカウントのIDだけ
      - name: アカウントIDをログで隠す
        if: steps.backend.outputs.exists == 'true'
        run: |
          for id in $(aws organizations list-accounts --query 'Accounts[].Id' --output text); do
            echo "::add-mask::${id}"
          done
          # 全アカウントの S3 バケット名も隠す(状態ファイルやログ用のバケット名を公開しないため)
          for b in $(aws s3api list-buckets --query 'Buckets[].Name' --output text); do
            echo "::add-mask::${b}"
          done
          mgmt=$(aws sts get-caller-identity --query Account --output text)
          for id in $(aws organizations list-accounts --query 'Accounts[].Id' --output text); do
            [ "${id}" = "${mgmt}" ] && continue
            creds=$(aws sts assume-role --role-arn "arn:aws:iam::${id}:role/zero-trust-minato-plan-readonly" \
              --role-session-name mask-buckets --query Credentials --output json 2>/dev/null) || continue
            for b in $(AWS_ACCESS_KEY_ID=$(echo "${creds}" | jq -r .AccessKeyId) \
                       AWS_SECRET_ACCESS_KEY=$(echo "${creds}" | jq -r .SecretAccessKey) \
                       AWS_SESSION_TOKEN=$(echo "${creds}" | jq -r .SessionToken) \
                       aws s3api list-buckets --query 'Buckets[].Name' --output text); do
              echo "::add-mask::${b}"
            done
          done
          # 組織の ID(o-xxxx)も隠す(ログ用 S3 のパスや ARN に出る)
          echo "::add-mask::$(aws organizations describe-organization --query Organization.Id --output text)"
          # Identity Center の ID ストアの ID(d-xxxx)は、アクセスポータルの URL と同じ文字列のため隠す
          for id in $(aws sso-admin list-instances --query 'Instances[].IdentityStoreId' --output text); do
            echo "::add-mask::${id}"
          done

      - name: terraform init
        if: steps.backend.outputs.exists == 'true'
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: terraform validate
        if: steps.backend.outputs.exists == 'true'
        run: terraform validate -no-color

      - name: terraform plan
        if: steps.backend.outputs.exists == 'true'
        run: terraform plan -no-color -lock-timeout=60s
